name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.21
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-dev.txt
      - run: ruff check services tests scripts && ruff format --check services tests scripts
      - run: pytest -q
        env:
          TEST_MONGO_URI: mongodb://localhost:27017
      - run: docker compose config --quiet
      - run: docker compose build orders payments
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - run: helm lint helm/payments && helm template demo helm/payments -f helm/payments/values-dev.yaml > /tmp/dev.yaml && helm template demo helm/payments -f helm/payments/values-prod.yaml > /tmp/prod.yaml
      - run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus" prom/prometheus:v3.4.1 check config /etc/prometheus/prometheus.yml
      - run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus" prom/prometheus:v3.4.1 test rules /etc/prometheus/alerts.test.yml
      - run: docker run --rm --entrypoint amtool -v "$PWD/monitoring:/etc/alertmanager" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
  publish:
    needs: [test, compose-smoke, minikube-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [orders, payments]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/payments-${{ matrix.service }}:${{ github.sha }}

  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-dev.txt
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke_stack.py --prometheus http://127.0.0.1:9090 --grafana http://127.0.0.1:3000 --evidence .run/compose-smoke.json
      - name: Capture container diagnostics
        if: always()
        run: mkdir -p .run && docker compose logs --no-color > .run/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-evidence
          path: .run/
      - run: docker compose down -v
        if: always()
  minikube-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - uses: azure/setup-kubectl@v4
        with: {version: v1.32.0}
      - run: pip install -r requirements-dev.txt
      - name: Start pinned Minikube
        run: |
          curl -fsSL https://storage.googleapis.com/minikube/releases/v1.35.0/minikube-linux-amd64 -o /tmp/minikube
          sudo install /tmp/minikube /usr/local/bin/minikube
          minikube start --driver=docker --cpus=2 --memory=4096 --kubernetes-version=v1.32.0
      - name: Build and deploy development release
        run: |
          minikube image build -t payments-orders:dev -f services/orders.Dockerfile .
          minikube image build -t payments-payments:dev -f services/payments.Dockerfile .
          kubectl create namespace payments
          kubectl -n payments create secret generic payments-runtime --from-literal=MONGO_URI=mongodb://demo-mongo:27017
          helm upgrade --install demo helm/payments -n payments -f helm/payments/values-dev.yaml --wait --timeout 5m
          kubectl -n payments create configmap prometheus-config --from-file=prometheus.yml=monitoring/prometheus-k8s.yml --from-file=alerts.yml=monitoring/alerts.yml
          kubectl -n payments create configmap alertmanager-config --from-file=alertmanager.yml=monitoring/alertmanager.yml
          kubectl -n payments create configmap grafana-datasource --from-file=default.yml=monitoring/grafana/provisioning/datasources/default.yml
          kubectl -n payments create configmap grafana-provider --from-file=default.yml=monitoring/grafana/provisioning/dashboards/default.yml
          kubectl -n payments create configmap grafana-dashboard --from-file=payments.json=monitoring/grafana/dashboards/payments.json
          kubectl -n payments create secret generic grafana-auth --from-literal=password=local-demo-change-me
          kubectl -n payments apply -f monitoring/kubernetes.yaml
          kubectl -n payments rollout status deployment/prometheus --timeout=180s
          kubectl -n payments rollout status deployment/grafana --timeout=180s
          kubectl -n payments rollout status deployment/alertmanager --timeout=180s
      - name: Verify install, upgrade and rollback
        shell: bash
        run: |
          mkdir -p .run
          kubectl -n payments port-forward svc/demo-orders 8000:8000 > .run/orders-forward.log 2>&1 &
          orders_forward=$!
          kubectl -n payments port-forward svc/demo-payments 8001:8000 > .run/payments-forward.log 2>&1 &
          payments_forward=$!
          kubectl -n payments port-forward svc/prometheus 9090:9090 > .run/prometheus-forward.log 2>&1 &
          kubectl -n payments port-forward svc/grafana 3000:3000 > .run/grafana-forward.log 2>&1 &
          python scripts/smoke_stack.py --prometheus http://127.0.0.1:9090 --grafana http://127.0.0.1:3000 --evidence .run/install.json
          minikube image build -t payments-orders:demo-v2 -f services/orders.Dockerfile .
          minikube image build -t payments-payments:demo-v2 -f services/payments.Dockerfile .
          helm upgrade demo helm/payments -n payments -f helm/payments/values-dev.yaml --set services.orders.tag=demo-v2 --set services.payments.tag=demo-v2 --wait --atomic --timeout 5m
          kill "$orders_forward" "$payments_forward" 2>/dev/null || true
          wait "$orders_forward" "$payments_forward" 2>/dev/null || true
          kubectl -n payments port-forward svc/demo-orders 8000:8000 >> .run/orders-forward.log 2>&1 &
          orders_forward=$!
          orders_forward=$!
          kubectl -n payments port-forward svc/demo-payments 8001:8000 >> .run/payments-forward.log 2>&1 &
          payments_forward=$!
          payments_forward=$!
          python scripts/smoke_stack.py --previous .run/install.json --evidence .run/upgrade.json
          helm rollback demo 1 -n payments --wait --timeout 5m
          kill "$orders_forward" "$payments_forward" 2>/dev/null || true
          wait "$orders_forward" "$payments_forward" 2>/dev/null || true
          kubectl -n payments port-forward svc/demo-orders 8000:8000 >> .run/orders-forward.log 2>&1 &
          orders_forward=$!
          orders_forward=$!
          kubectl -n payments port-forward svc/demo-payments 8001:8000 >> .run/payments-forward.log 2>&1 &
          payments_forward=$!
          payments_forward=$!
          python scripts/smoke_stack.py --previous .run/install.json --evidence .run/rollback.json
          helm history demo -n payments > .run/helm-history.txt
      - name: Capture cluster diagnostics
        if: always()
        run: |
          mkdir -p .run
          kubectl -n payments get pods,svc,pvc -o wide > .run/cluster.txt || true
          kubectl -n payments logs -l app=demo-orders --all-containers > .run/orders.log || true
          kubectl -n payments logs -l app=demo-payments --all-containers > .run/payments.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minikube-evidence
          path: .run/
      - run: minikube delete
        if: always()
