{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
data:
  MONGO_DATABASE: {{ $svc.database | quote }}
  PAYMENTS_URL: {{ default (printf "http://%s-payments:8000" $.Release.Name) $.Values.config.paymentsUrl | quote }}
  PAYMENT_TIMEOUT_SECONDS: {{ $.Values.config.timeout | quote }}
  PAYMENT_ATTEMPTS: {{ $.Values.config.attempts | quote }}
  RECOVERY_INTERVAL_SECONDS: {{ $.Values.config.recoveryInterval | quote }}
  PAYMENT_RESPONSE_DELAY_SECONDS: {{ $.Values.config.paymentDelay | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $name }}}
  template:
    metadata:
      labels: {app: {{ $.Release.Name }}-{{ $name }}}
      annotations:
        checksum/config: {{ toJson (dict "config" $.Values.config "database" $svc.database) | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image }}:{{ $svc.tag }}"
          imagePullPolicy: {{ $svc.pullPolicy }}
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: {{ $.Release.Name }}-{{ $name }}}
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: {name: {{ $.Values.secretName }}, key: MONGO_URI}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            timeoutSeconds: 6
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            timeoutSeconds: 2
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /health/live, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  selector: {app: {{ $.Release.Name }}-{{ $name }}}
  ports: [{port: 8000, targetPort: 8000}]
{{- end }}
{{- end }}
