services:
  mongo:
    image: mongo:7.0.21
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  payments:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=6)"]
      interval: 10s
      timeout: 7s
      start_period: 15s
      retries: 5
    build:
      context: .
      dockerfile: services/payments.Dockerfile
    ports: ["127.0.0.1:8001:8000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: payments
      PAYMENT_RESPONSE_DELAY_SECONDS: ${PAYMENT_RESPONSE_DELAY_SECONDS:-0}
    depends_on:
      mongo: {condition: service_healthy}
  orders:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=6)"]
      interval: 10s
      timeout: 7s
      start_period: 15s
      retries: 5
    build:
      context: .
      dockerfile: services/orders.Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: orders
      PAYMENTS_URL: http://payments:8000
    depends_on:
      mongo: {condition: service_healthy}
      payments: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.4.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:9093:9093"]
    volumes: ["./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
  grafana:
    image: grafana/grafana:12.0.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-demo-change-me}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  mongo-data:
