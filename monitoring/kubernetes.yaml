---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.0.1
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-auth, key: password}
          volumeMounts:
            - {name: grafana-datasource, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: grafana-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: grafana-dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: grafana-datasource
          configMap: {name: grafana-datasource}
        - name: grafana-provider
          configMap: {name: grafana-provider}
        - name: grafana-dashboard
          configMap: {name: grafana-dashboard}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
