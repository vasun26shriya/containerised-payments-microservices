{
  "rule_files": [
    "alerts.yml"
  ],
  "evaluation_interval": "15s",
  "tests": [
    {
      "name": "sustained-errors",
      "interval": "15s",
      "input_series": [
        {
          "series": "http_requests_total{service=\"payments\",method=\"POST\",route=\"/payments\",status=\"200\"}",
          "values": "0+80x40"
        },
        {
          "series": "http_requests_total{service=\"payments\",method=\"POST\",route=\"/payments\",status=\"500\"}",
          "values": "0+20x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "HighErrorRate",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "HighErrorRate",
          "exp_alerts": [
            {
              "exp_labels": {
                "service": "payments",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Sustained server errors for payments"
              }
            }
          ]
        }
      ]
    },
    {
      "name": "below-error-threshold",
      "interval": "15s",
      "input_series": [
        {
          "series": "http_requests_total{service=\"payments\",method=\"POST\",route=\"/payments\",status=\"200\"}",
          "values": "0+95x40"
        },
        {
          "series": "http_requests_total{service=\"payments\",method=\"POST\",route=\"/payments\",status=\"500\"}",
          "values": "0+5x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "HighErrorRate",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "HighErrorRate",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "sustained-slow",
      "interval": "15s",
      "input_series": [
        {
          "series": "http_requests_total{service=\"payments\",method=\"POST\",route=\"/payments\",status=\"200\"}",
          "values": "0+100x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"0.05\"}",
          "values": "0+0x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"0.1\"}",
          "values": "0+0x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"0.25\"}",
          "values": "0+0x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"0.5\"}",
          "values": "0+0x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"1\"}",
          "values": "0+0x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"2\"}",
          "values": "0+95x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"5\"}",
          "values": "0+100x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"10\"}",
          "values": "0+100x40"
        },
        {
          "series": "http_request_duration_seconds_bucket{service=\"payments\",method=\"POST\",route=\"/payments\",le=\"+Inf\"}",
          "values": "0+100x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "SlowResponses",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "SlowResponses",
          "exp_alerts": [
            {
              "exp_labels": {
                "service": "payments",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "P95 latency exceeds one second for payments"
              }
            }
          ]
        }
      ]
    }
  ]
}